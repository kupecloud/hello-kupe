name: Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  infra:
    name: Infrastructure
    uses: ./.github/workflows/infra.yaml

  game:
    name: Game
    uses: ./.github/workflows/game.yaml

  go-lint:
    name: Go Lint
    uses: ./.github/workflows/go-lint.yaml

  action-lint:
    name: Action Lint
    uses: ./.github/workflows/action-lint.yaml

  helm-lint:
    name: Helm Lint
    uses: ./.github/workflows/helm-lint.yaml

  rbac-audit:
    name: RBAC Secrets Audit
    uses: ./.github/workflows/helm-rbac-audit.yaml
    with:
      runs-on: ubuntu-latest
      chart-path: chart
      template-args: --set tenant=example-tenant --set cluster=example
      release-name: hello-kupe

  automount-audit:
    name: Pod Automount Audit
    uses: ./.github/workflows/helm-automount-audit.yaml
    with:
      runs-on: ubuntu-latest
      chart-path: chart
      template-args: --set tenant=example-tenant --set cluster=example
      release-name: hello-kupe

  unit-tests:
    name: Unit Tests
    needs:
      - go-lint
      - action-lint
      - helm-lint
    uses: ./.github/workflows/unit-tests.yaml

  gosec:
    name: Go Security
    needs:
      - unit-tests
    uses: ./.github/workflows/gosec.yaml

  samples:
    name: Samples
    uses: ./.github/workflows/samples.yaml

  version:
    name: Version
    needs:
      - gosec
      - game
      - infra
      - rbac-audit
      - automount-audit
    uses: ./.github/workflows/semantic-release-preview.yaml
    with:
      runs-on: ubuntu-latest
    permissions:
      contents: write

  publish-image:
    name: Publish Image
    needs:
      - version
    if: needs.version.outputs.new_release_published == 'true'
    uses: ./.github/workflows/publish-image.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      version: ${{ needs.version.outputs.new_release_version }}

  release:
    name: Release
    needs:
      - version
      - publish-image
    uses: ./.github/workflows/semantic-release.yaml
    with:
      runs-on: ubuntu-latest
      image-digest: ${{ needs.publish-image.outputs.digest }}
      image-version: ${{ needs.version.outputs.new_release_version }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      id-token: write
