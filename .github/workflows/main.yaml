name: Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The same gates the PR ran. There is no branch protection, so this is what
  # guarantees a released tree passed them (kupecloud/github-workflows#14).
  gates:
    name: Gates
    uses: ./.github/workflows/gates.yaml
    with:
      pre-commit-args: --all-files --show-diff-on-failure --hook-stage manual
      # govulncheck runs weekly in security.yaml, so a new advisory does not
      # block an unrelated release.
      skip: govulncheck

  version:
    name: Version
    needs:
      - gates
    uses: ./.github/workflows/semantic-release-preview.yaml
    with:
      runs-on: ubuntu-latest
    permissions:
      contents: write

  publish-image:
    name: Publish Image
    needs:
      - version
    if: needs.version.outputs.new_release_published == 'true'
    uses: ./.github/workflows/publish-image.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      version: ${{ needs.version.outputs.new_release_version }}

  release:
    name: Release
    needs:
      - version
      - publish-image
    uses: ./.github/workflows/semantic-release.yaml
    with:
      runs-on: ubuntu-latest
      image-digest: ${{ needs.publish-image.outputs.digest }}
      image-version: ${{ needs.version.outputs.new_release_version }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      id-token: write
