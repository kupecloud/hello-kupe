name: Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do NOT cancel in-progress main runs: a run cancelled after `release` has
  # tagged a version but before `publish-image` pushes the image leaves a
  # git version with no matching image (ImagePullBackOff for chart installs).
  # Queued runs still coalesce; only pr.yaml may cancel in progress.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  go-lint:
    name: Go Lint
    uses: ./.github/workflows/go-lint.yaml

  action-lint:
    name: Action Lint
    uses: ./.github/workflows/action-lint.yaml

  helm-lint:
    name: Helm Lint
    uses: ./.github/workflows/helm-lint.yaml

  rbac-audit:
    name: RBAC Secrets Audit
    uses: kupecloud/github-workflows/.github/workflows/helm-rbac-audit.yaml@98b8368020991c33bf4041bee6081d865ff4850a # v2.4.0
    with:
      chart-path: chart
      template-args: --set tenant=example-tenant --set cluster=example
      release-name: hello-kupe

  automount-audit:
    name: Pod Automount Audit
    uses: kupecloud/github-workflows/.github/workflows/helm-automount-audit.yaml@98b8368020991c33bf4041bee6081d865ff4850a # v2.4.0
    with:
      chart-path: chart
      template-args: --set tenant=example-tenant --set cluster=example
      release-name: hello-kupe

  unit-tests:
    name: Unit Tests
    needs:
      - go-lint
      - action-lint
      - helm-lint
    uses: ./.github/workflows/unit-tests.yaml

  gosec:
    name: Go Security
    needs:
      - unit-tests
    uses: ./.github/workflows/gosec.yaml

  # Build BEFORE releasing so the release commit (the one the git tag points at,
  # and the one tenants install from) can carry the image digest:
  #   version (dry run) -> publish-image (build/push/sign) -> release (stamps
  #   tag@digest into chart/values.yaml, then tags).
  #
  # Why this chart needs it at all: the platform's verify-platform-images
  # ImageValidatingPolicy denies any ghcr.io/kupecloud/* pod whose image has no
  # digest — a cosign signature is bound to a digest, so a bare tag is
  # unverifiable. The vCluster syncer hits that denial when it creates the host
  # twin of a tenant's pod, and the tenant only sees a pod stuck Pending.
  #
  # A failure after publish-image leaves an image that no git tag points at; the
  # next run computes the same version and overwrites it.
  version:
    name: Version
    needs:
      - gosec
      - rbac-audit
    uses: kupecloud/github-workflows/.github/workflows/semantic-release-preview.yaml@9e4df7e450d89d7f2efdd1997691cbd59ef26002 # v2.6.0
    permissions:
      contents: write
    secrets: inherit

  publish-image:
    name: Publish Image
    needs:
      - version
    if: needs.version.outputs.new_release_published == 'true'
    uses: ./.github/workflows/publish-image.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      version: ${{ needs.version.outputs.new_release_version }}
    secrets: inherit

  release:
    name: Release
    needs:
      - version
      - publish-image
    uses: kupecloud/github-workflows/.github/workflows/semantic-release.yaml@9e4df7e450d89d7f2efdd1997691cbd59ef26002 # v2.6.0
    with:
      image-digest: ${{ needs.publish-image.outputs.digest }}
      image-version: ${{ needs.version.outputs.new_release_version }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      id-token: write
    secrets: inherit
