name: Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do NOT cancel in-progress main runs: a run cancelled after `release` has
  # tagged a version but before `publish-image` pushes the image leaves a
  # git version with no matching image (ImagePullBackOff for chart installs).
  # Queued runs still coalesce; only pr.yaml may cancel in progress.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  go-lint:
    name: Go Lint
    uses: ./.github/workflows/go-lint.yaml

  action-lint:
    name: Action Lint
    uses: ./.github/workflows/action-lint.yaml

  helm-lint:
    name: Helm Lint
    uses: ./.github/workflows/helm-lint.yaml

  rbac-audit:
    name: RBAC Secrets Audit
    uses: kupecloud/github-workflows/.github/workflows/helm-rbac-audit.yaml@98b8368020991c33bf4041bee6081d865ff4850a # v2.4.0
    with:
      chart-path: chart
      template-args: --set tenant=example-tenant --set cluster=example
      release-name: hello-kupe

  automount-audit:
    name: Pod Automount Audit
    uses: kupecloud/github-workflows/.github/workflows/helm-automount-audit.yaml@98b8368020991c33bf4041bee6081d865ff4850a # v2.4.0
    with:
      chart-path: chart
      template-args: --set tenant=example-tenant --set cluster=example
      release-name: hello-kupe

  unit-tests:
    name: Unit Tests
    needs:
      - go-lint
      - action-lint
      - helm-lint
    uses: ./.github/workflows/unit-tests.yaml

  gosec:
    name: Go Security
    needs:
      - unit-tests
    uses: ./.github/workflows/gosec.yaml

  release:
    name: Release
    needs:
      - gosec
      - rbac-audit
    uses: kupecloud/github-workflows/.github/workflows/semantic-release.yaml@98b8368020991c33bf4041bee6081d865ff4850a # v2.4.0
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      id-token: write
    secrets: inherit

  publish-image:
    name: Publish Image
    needs:
      - release
    if: needs.release.outputs.new_release_published == 'true'
    uses: ./.github/workflows/publish-image.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      version: ${{ needs.release.outputs.new_release_version }}
    secrets: inherit
