name: PR

on:
  pull_request:
    branches:
      - main
    # Every path a hook or job reads. The whole-repo hooks (codespell,
    # gitleaks, whitespace, check-yaml/json) read every tracked file, so this
    # list covers the tree; keep it in step when a new top-level path appears.
    paths:
      - "go.mod"
      - "go.sum"
      - "**.go"
      - "**.md"
      - "Dockerfile"
      - ".dockerignore"
      - ".gitignore"
      - ".golangci.yaml"
      - ".markdownlint-cli2.yaml"
      - ".pre-commit-config.yaml"
      - ".releaserc.json"
      - "renovate.json"
      - "chart/**"
      - ".github/**"
      - "Makefile"
      - "samples/**"
      - "web/**"
      - "infra/**"
      - "scripts/**"
      - "docs/**"
      - "local/**"
      - "compose.yaml"
      - "security/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every check the old PR jobs ran is a pre-commit hook now; the slow ones
  # are manual-stage hooks (kupecloud/github-workflows#14).
  gates:
    name: Gates
    uses: ./.github/workflows/gates.yaml
    with:
      pre-commit-args: --all-files --show-diff-on-failure --hook-stage manual
      # govulncheck (root module) never ran on PRs; it runs weekly in
      # security.yaml. The sample's govulncheck still runs here, as before.
      skip: govulncheck

  # Docker builds do not map to a hook. They run beside the gates job, not
  # after it, so the PR gets both answers at once.
  # Not behind KUPE_CI_HEAVY: this public repository builds on GitHub-hosted
  # runners at no cost to kupe runner capacity, and this is the only CI build
  # of the sample Dockerfiles (kupecloud/github-workflows#20).
  images:
    name: Image ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hello-kupe
            context: .
            dockerfile: Dockerfile
          - name: managed-database api
            context: samples/managed-database
            dockerfile: Dockerfile.api
          - name: managed-database web
            context: samples/managed-database
            dockerfile: Dockerfile.web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        working-directory: ${{ matrix.context }}
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: docker build -f "$DOCKERFILE" .

  # Every image the prod chart deploys, scanned with Trivy: fails on a HIGH or
  # CRITICAL with a fix available. A local copy of the shared workflow (see
  # trivy-image-scan.yaml), on ubuntu-latest because this repository is public.
  # Images used only for local development and as CI service containers
  # (compose.yaml, the gates.yaml service container, scripts/kind.mjs, the
  # sample's local-smoke.sh) are not deployed: they are listed, with reasons,
  # in security/dev-only-images.yaml and reported weekly, non-blocking, by
  # dev-image-report.yaml.
  image-scan:
    name: Image scan
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/trivy-image-scan.yaml
    with:
      chart-path: chart
      # The always-on public game (chart/values/mgmt/prod.yaml) is the only
      # deployed render. The managed-database sample chart is not listed: its
      # images are empty values the reader builds and pushes.
      values-files: |
        chart/values/mgmt/prod.yaml
