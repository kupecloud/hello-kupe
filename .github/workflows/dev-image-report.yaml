name: Dev image report

# Non-blocking report for reviewed local development and CI images.

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
  # Report (never block) on a PR that changes the list or this workflow.
  pull_request:
    branches:
      - main
    paths:
      - "security/dev-only-images.yaml"
      - ".github/workflows/dev-image-report.yaml"
      - ".github/workflows/trivy-image-scan.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  report:
    name: Dev image report
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/trivy-image-scan.yaml
    with:
      runs-on: ubuntu-latest
      scan-mode: full
      images-from-exclude-file: true
      report-only: true
      artifact-name: dev-image-report
