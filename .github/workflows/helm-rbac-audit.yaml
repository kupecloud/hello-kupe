name: Helm RBAC Audit

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          GitHub-hosted runner label.
        required: false
        default: ubuntu-latest
        type: string
      chart-path:
        description: Path to the Helm chart directory
        required: true
        type: string
      template-args:
        description: Arguments passed to helm template (e.g., "-f values.yaml -f values/prod.yaml")
        required: false
        default: ""
        type: string
      release-name:
        description: Release name for helm template
        required: false
        default: "audit"
        type: string

permissions:
  contents: read

jobs:
  rbac-audit:
    name: rbac secrets audit
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.18.6

      - name: Install yq
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSLo "$HOME/.local/bin/yq" https://github.com/mikefarah/yq/releases/download/v4.52.5/yq_linux_amd64
          chmod +x "$HOME/.local/bin/yq"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Render chart
        shell: bash
        env:
          RELEASE_NAME: ${{ inputs.release-name }}
          CHART_PATH: ${{ inputs.chart-path }}
        run: helm template "$RELEASE_NAME" "$CHART_PATH" ${{ inputs.template-args }} > /tmp/rendered.yaml

      - name: Audit cluster-wide secrets access
        id: rbac-audit
        shell: bash
        run: |
          set -euo pipefail

          # shellcheck disable=SC2016
          offenders=$(yq -N \
            'select(.kind == "ClusterRole")
            | select([.rules[]? | select(.resources != null) | .resources[]
                | select(. == "secrets" or test("^\*$"))] | length > 0)
            | .metadata.name' \
            /tmp/rendered.yaml | sort -u)

          if [ -n "$offenders" ]; then
            echo "::error::Rendered chart contains ClusterRoles with cluster-wide secrets access:"
            echo "$offenders"
            echo ""
            echo "Cluster-wide secrets read is a blast-radius amplifier. Prefer"
            echo "narrowing the rule to specific namespaces (a Role, not a"
            echo "ClusterRole) or to named resources. This gate has no allowlist"
            echo "input; if the cluster-wide grant is genuinely required, document"
            echo "the justification in security_best_practices_report.md."
            exit 1
          fi
          echo "OK: no cluster-wide secrets access in rendered ClusterRoles"

      - name: rbac audit summary
        if: always()
        run: |
          if [ "${{ steps.rbac-audit.outcome }}" = "success" ]; then
            {
              echo "### RBAC Secrets Audit"
              echo "No cluster-wide secrets access found in rendered ClusterRoles."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### RBAC Secrets Audit"
              echo "**FAILED** — one or more ClusterRoles grant cluster-wide secrets access."
              echo ""
              echo "- Review the job logs for the list of offending ClusterRoles."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
