name: Publish Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Unique image tag (for example demo-20261026). Does not create a release.
        required: true
        type: string
      digest:
        description: Existing untagged GHCR digest to scan, tag and sign. Empty builds a new image.
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      version:
        description: Semantic release version without the leading v
        required: true
        type: string
      digest:
        description: Existing untagged GHCR digest to scan, tag and sign. Empty builds a new image.
        required: false
        default: ""
        type: string
    outputs:
      digest:
        description: Digest of the pushed, signed image (stamped into the release commit)
        value: ${{ jobs.publish.outputs.digest }}

permissions:
  contents: read
  packages: write
  id-token: write # Required for cosign keyless signing

jobs:
  publish:
    uses: ./.github/workflows/build-publish-image.yaml
    with:
      runs-on: ubuntu-latest
      version: ${{ inputs.version }}
      digest: ${{ inputs.digest }}
