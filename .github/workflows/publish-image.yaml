name: Publish Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Unique image tag (for example demo-20261026). Does not create a release.
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: Semantic release version without the leading v
        required: true
        type: string
    outputs:
      digest:
        description: Digest of the pushed, signed image (stamped into the release commit)
        value: ${{ jobs.publish.outputs.digest }}

permissions:
  contents: read
  packages: write
  id-token: write # Required for cosign keyless signing

jobs:
  publish:
    uses: kupecloud/github-workflows/.github/workflows/publish-image.yaml@9e4df7e450d89d7f2efdd1997691cbd59ef26002 # v2.6.0
    with:
      runs-on: ubuntu-latest
      version: ${{ inputs.version }}
    secrets: inherit
