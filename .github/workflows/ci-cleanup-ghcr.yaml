name: Cleanup GHCR Untagged

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label (ubuntu-latest by default).
        required: false
        default: "ubuntu-latest"
        type: string
      package_name:
        description: GHCR package name under the owner (defaults to the repository name).
        required: false
        type: string
        default: ""
      retention_days:
        description: Keep untagged versions updated within this many days.
        required: false
        type: number
        default: 7
      owner_type:
        description: Package owner type — "orgs" or "users".
        required: false
        type: string
        default: "orgs"
      dry_run:
        description: Log candidates without deleting anything.
        required: false
        type: boolean
        default: false

permissions:
  packages: write

jobs:
  cleanup:
    name: Delete untagged versions older than retention window
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Prune untagged GHCR versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ inputs.owner_type }}
          REPO_NAME: ${{ github.event.repository.name }}
          PACKAGE_INPUT: ${{ inputs.package_name }}
          RETENTION_DAYS: ${{ inputs.retention_days }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          package="${PACKAGE_INPUT:-$REPO_NAME}"
          package_enc=${package//\//%2F}

          cutoff_epoch=$(date -u -d "${RETENTION_DAYS} days ago" +%s)
          echo "Owner:          ${OWNER_TYPE}/${OWNER}"
          echo "Package:        ${package}"
          echo "Retention days: ${RETENTION_DAYS}"
          echo "Cutoff (UTC):   $(date -u -d "@${cutoff_epoch}" -Iseconds)"
          echo "Dry run:        ${DRY_RUN}"
          echo

          kept_tagged=0
          kept_recent=0
          kept_referenced=0
          deleted=0
          would_delete=0
          fetch_failed=0

          reg_bearer=$(printf '%s' "${GH_TOKEN}" | base64 | tr -d '\n')
          registry_path=$(printf '%s/%s' "${OWNER}" "${package}" | tr '[:upper:]' '[:lower:]')
          declare -A referenced=()

          page=1
          while :; do
            response=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/${OWNER_TYPE}/${OWNER}/packages/container/${package_enc}/versions?per_page=100&page=${page}")
            [ "$(echo "$response" | jq 'length')" -eq 0 ] && break

            while IFS=$'\t' read -r digest tag_count; do
              [ "$tag_count" -gt 0 ] || continue
              curl_status=0
              manifest=$(curl -fsSL \
                -H "Authorization: Bearer ${reg_bearer}" \
                -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
                "https://ghcr.io/v2/${registry_path}/manifests/${digest}") || curl_status=$?
              if [ "$curl_status" -ne 0 ]; then
                echo "::error::Manifest fetch failed for tagged digest ${digest} (curl exit ${curl_status})"
                fetch_failed=1
                continue
              fi
              if ! children=$(jq -r 'if .manifests then .manifests[].digest else empty end' <<< "$manifest"); then
                echo "::error::Manifest parse failed for tagged digest ${digest}"
                fetch_failed=1
                continue
              fi
              for child in $children; do
                referenced["$child"]=1
              done
            done < <(echo "$response" | jq -r '.[] | [.name, (.metadata.container.tags | length)] | @tsv')

            page=$((page + 1))
          done
          echo "Referenced child manifests (multi-arch + attestations, always kept): ${#referenced[@]}"
          echo

          if [ "$fetch_failed" -ne 0 ]; then
            echo "::error::One or more tagged-manifest fetches failed; the referenced set may be incomplete. Failing closed: skipping all deletions this run (report-only)."
            DRY_RUN="true"
          fi

          delete_ids=()
          page=1
          while :; do
            response=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/${OWNER_TYPE}/${OWNER}/packages/container/${package_enc}/versions?per_page=100&page=${page}")

            count=$(echo "$response" | jq 'length')
            if [ "$count" -eq 0 ]; then
              break
            fi

            while IFS=$'\t' read -r id digest updated_at tag_count; do
              if [ "$tag_count" -gt 0 ]; then
                kept_tagged=$((kept_tagged + 1))
                continue
              fi

              if [ -n "${referenced[$digest]:-}" ]; then
                kept_referenced=$((kept_referenced + 1))
                continue
              fi

              updated_epoch=$(date -u -d "$updated_at" +%s)
              if [ "$updated_epoch" -gt "$cutoff_epoch" ]; then
                kept_recent=$((kept_recent + 1))
                continue
              fi

              if [ "$DRY_RUN" = "true" ]; then
                echo "DRY RUN: would delete version ${id} (${digest}, updated ${updated_at})"
                would_delete=$((would_delete + 1))
              else
                echo "Marking version ${id} for deletion (${digest}, updated ${updated_at})"
                delete_ids+=("$id")
              fi
            done < <(echo "$response" | jq -r '.[] | [.id, .name, .updated_at, (.metadata.container.tags | length)] | @tsv')

            page=$((page + 1))
          done

          for id in "${delete_ids[@]:-}"; do
            [ -n "$id" ] || continue
            echo "Deleting version ${id}"
            gh api --method DELETE \
              "/${OWNER_TYPE}/${OWNER}/packages/container/${package_enc}/versions/${id}"
            deleted=$((deleted + 1))
          done

          echo
          echo "Summary:"
          echo "  kept (tagged):     ${kept_tagged}"
          echo "  kept (referenced): ${kept_referenced}"
          echo "  kept (recent):     ${kept_recent}"
          if [ "$DRY_RUN" = "true" ]; then
            echo "  would delete:   ${would_delete}"
          else
            echo "  deleted:        ${deleted}"
          fi

          {
            echo "### GHCR cleanup: ${package}"
            echo ""
            echo "| metric | count |"
            echo "| --- | ---: |"
            echo "| kept (tagged) | ${kept_tagged} |"
            echo "| kept (referenced by tagged index) | ${kept_referenced} |"
            echo "| kept (recent, < ${RETENTION_DAYS}d) | ${kept_recent} |"
            if [ "$DRY_RUN" = "true" ]; then
              echo "| would delete | ${would_delete} |"
            else
              echo "| deleted | ${deleted} |"
            fi
            if [ "$fetch_failed" -ne 0 ]; then
              echo ""
              echo "> **Failed closed:** tagged-manifest fetch errors — deletions were skipped this run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$fetch_failed" -ne 0 ]; then
            exit 1
          fi
