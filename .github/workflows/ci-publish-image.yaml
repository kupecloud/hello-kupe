name: Publish Image

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label (ubuntu-latest by default).
        required: false
        default: "ubuntu-latest"
        type: string
      version:
        description: Semantic release version without the leading v
        required: true
        type: string
      platforms:
        description: Target platforms for Docker buildx
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      dockerfile:
        description: Path to Dockerfile
        required: false
        type: string
        default: "./Dockerfile"
      context:
        description: Docker build context path
        required: false
        type: string
        default: "."
      build-args:
        description: Docker build arguments (newline-separated KEY=VALUE)
        required: false
        type: string
        default: ""
    outputs:
      digest:
        description: >-
          Manifest digest (sha256:...) of the pushed and signed image. Callers
          that build BEFORE semantic-release pass it to semantic-release.yaml's
          image-digest input so the release commit pins tag@digest.
        value: ${{ jobs.publish.outputs.digest }}

permissions:
  contents: read
  packages: write
  id-token: write # Required for cosign keyless signing via OIDC

jobs:
  publish:
    name: Build, Push & Sign
    runs-on: ${{ inputs.runs-on }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
        with:
          cosign-release: v3.0.5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=raw,value=${{ inputs.version }}
            type=raw,value=v${{ inputs.version }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}

      - name: Sign image with cosign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes --new-bundle-format=false --use-signing-config=false \
            "ghcr.io/${{ github.repository }}@${DIGEST}"
