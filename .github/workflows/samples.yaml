name: Samples

on:
  workflow_call:

permissions:
  contents: read

jobs:
  managed-database-go:
    name: managed-database Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/managed-database
    env:
      GOWORK: "off"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: samples/managed-database/go.mod
          cache-dependency-path: samples/managed-database/go.sum

      - name: Check go mod tidy
        run: go mod tidy -diff

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test -race -timeout 120s ./...

      - name: Run golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4 run --timeout=10m --config ../../.golangci.yaml ./...

      - name: Run gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.25.0 -exclude-generated ./...

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  managed-database-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/managed-database/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: samples/managed-database/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  managed-database-helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112
        with:
          version: v3.18.6
      - run: >-
          helm lint samples/managed-database/chart
          --set tenant=example-tenant --set cluster=example
          --set api.image.repository=ghcr.io/example/todo-api --set api.image.tag=0.1.0
          --set web.image.repository=ghcr.io/example/todo-web --set web.image.tag=0.1.0

  managed-database-images:
    name: managed-database image ${{ matrix.dockerfile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - Dockerfile.api
          - Dockerfile.web
    defaults:
      run:
        working-directory: samples/managed-database
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: docker build -f "$DOCKERFILE" .

  registry-chart:
    name: registry sample chart render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render the chart with a registry image
        run: |
          helm template hello-kupe ./chart \
            --set tenant=acme --set cluster=prod \
            --set image.repository=registry.kupe.cloud/acme/hello-kupe \
            --set image.tag=1.0.0 > "$RUNNER_TEMP/registry-render.yaml"
          grep -q 'image: "registry.kupe.cloud/acme/hello-kupe:1.0.0"' "$RUNNER_TEMP/registry-render.yaml"
          if grep -n imagePullSecrets "$RUNNER_TEMP/registry-render.yaml"; then
            echo "the chart renders imagePullSecrets; a connected cluster needs none" >&2
            exit 1
          fi

  registry-terraform-fmt:
    name: registry sample terraform fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Check formatting
        run: terraform fmt -check -recursive samples/registry/terraform
