name: Game

on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run typecheck && npm test
        working-directory: web

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_DB: hello_kupe
          POSTGRES_PASSWORD: local-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hello_kupe"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Initialize application roles
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -d hello_kupe -v ON_ERROR_STOP=1 < scripts/local-postgres/init.sql
      - name: Apply migrations twice to check repeatability
        env:
          DATABASE_URL: postgres://app_owner:local-owner@127.0.0.1:5432/hello_kupe?sslmode=disable
        run: |
          go run ./cmd/hello-kupe migrate
          go run ./cmd/hello-kupe migrate
      - name: Verify rules, persistence and role separation
        env:
          TEST_DATABASE_URL: postgres://app_readwrite:local-readwrite@127.0.0.1:5432/hello_kupe?sslmode=disable
        run: go test -race -timeout 120s ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag hello-kupe:ci .
