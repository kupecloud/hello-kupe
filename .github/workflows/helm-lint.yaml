name: Helm Lint

on:
  workflow_call:

jobs:
  helm-lint:
    uses: ./.github/workflows/ci-helm-lint.yaml
    with:
      runs-on: ubuntu-latest
      helm-version: v3.18.6
      chart-path: chart
      lint-args: --set tenant=example-tenant --set cluster=example

  helm-lint-database:
    uses: ./.github/workflows/ci-helm-lint.yaml
    with:
      runs-on: ubuntu-latest
      helm-version: v3.18.6
      chart-path: chart
      lint-args: --set tenant=example-tenant --set cluster=example --set database.enabled=true
