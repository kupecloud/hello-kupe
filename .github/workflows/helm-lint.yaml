name: Helm Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112
        with:
          version: v3.18.6
      - run: helm lint chart --set tenant=example-tenant --set cluster=example
      - run: helm lint chart --set tenant=example-tenant --set cluster=example --set database.enabled=true
