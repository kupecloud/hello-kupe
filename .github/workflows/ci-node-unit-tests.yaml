name: Node Unit Tests

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label (ubuntu-latest by default).
        required: false
        default: "ubuntu-latest"
        type: string
      node-version:
        description: Node.js version to install
        required: false
        default: "22"
        type: string
      working-directory:
        description: Directory containing package.json
        required: false
        default: "."
        type: string
      test-script:
        description: npm script name for the unit test runner
        required: false
        default: "test"
        type: string
      upload-coverage:
        description: Upload coverage/ as an artifact when present
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  unit-tests:
    name: Run unit tests
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        id: unit
        shell: bash
        env:
          TEST_SCRIPT: ${{ inputs.test-script }}
        run: |
          set -euo pipefail
          npm run "$TEST_SCRIPT"

      - name: Unit test summary
        if: always()
        shell: bash
        env:
          TEST_SCRIPT: ${{ inputs.test-script }}
        run: |
          set -euo pipefail
          {
            echo "### Unit tests"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| npm run ${TEST_SCRIPT} | ${{ steps.unit.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: inputs.upload-coverage && always() && hashFiles(format('{0}/coverage/**', inputs.working-directory)) != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: ${{ inputs.working-directory }}/coverage/
          retention-days: 7
