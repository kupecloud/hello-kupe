name: Trivy Image Scan

# The public-repo copy of github-workflows' trivy-image-scan.yaml (at
# kupecloud/github-workflows v2.14.0, 3e77e1a3a6e400f0495adfb3fef51f57ffd769f6):
# github-workflows is private, so a public repo cannot call it, as gates.yaml
# copies pre-commit-gates.yaml. Keep it in step with the shared file; change
# nothing below this paragraph except to match it.
#
# Scans every container image a repository deploys, first-party and
# third-party, with Trivy. Images come from any mix of three sources:
#
#   - a Helm chart, rendered once per values-files line;
#   - YAML files (Kubernetes manifests, docker-compose files), read as they are;
#   - an explicit image list.
#
# From the rendered and raw YAML, every `image:` and `imageName:` string at any
# depth is taken: containers and initContainers of every workload kind, pod
# templates embedded in other resources, CloudNativePG's imageName and compose
# services alike. Values that are not image references (a Kyverno pattern such
# as "!*:latest") are listed and skipped; in a manifests file, a value using
# variable interpolation (${TAG}) fails the job, since it names an image the
# scan cannot resolve. The list is deduplicated and each image is scanned for
# linux/amd64 (every prod node).
#
# Policy: the job FAILS on any HIGH or CRITICAL vulnerability that has a fix
# available (Trivy Status "fixed", what --ignore-unfixed keeps), from one
# scan per image with --severity HIGH,CRITICAL.
# HIGH and CRITICAL findings with no fix are reported, not failed. A third-party
# image fails too when upstream has a fixed release: the fix is bumping the pin.
#
# The only exception is a reviewed baseline (baseline-file, default
# security/image-baselines.yaml): for a third-party image whose findings have a
# package fix but no upstream image release that ships it. An entry covers one
# repository at one digest, on the platforms it lists, and only the exact
# findings it lists (ID, package, installed version and target). A CRITICAL is
# never baselined. An entry expires at most 90 days after its review; an
# expired, malformed or duplicate entry fails the job. Baselined findings stay
# in results.json and the summary, marked as such. There is no other waiver.

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label. Empty (the default) picks by repository visibility,
          as pre-commit-gates does: kupe-small for a private repository,
          ubuntu-latest for a public one. The runner needs bash, curl, jq and
          tar, and egress to github.com, mirror.gcr.io (the Trivy DB) and
          every registry the images live in.
        required: false
        default: ""
        type: string
      chart-path:
        description: Path to the Helm chart directory. Empty skips the chart render.
        required: false
        default: ""
        type: string
      values-files:
        description: >-
          Values files to render, one render per line. Each line is one or more
          whitespace-separated paths, passed to helm template as -f in order
          after template-args, so a line such as "values.yaml values/prod.yaml"
          layers prod over the base file. Blank lines and lines starting with
          # are skipped. Empty renders the chart once with template-args only.
          Ignored when chart-path is empty.
        required: false
        default: ""
        type: string
      template-args:
        description: Arguments passed to every helm template render, before the values-files line (shell words, e.g. "--set global.env=prod")
        required: false
        default: ""
        type: string
      release-name:
        description: Release name for helm template
        required: false
        default: "scan"
        type: string
      manifests:
        description: >-
          YAML files read without rendering, one path or bash glob per line
          (globstar on, so "deploy/**/*.yaml" works): Kubernetes manifests,
          docker-compose files. A line that matches no file fails the job.
          Blank lines and lines starting with # are skipped.
        required: false
        default: ""
        type: string
      images:
        description: >-
          Image references to scan as well, one per line, for images no YAML
          in the repository names (for example one an operator creates from a
          value embedded in a string). Blank lines and lines starting with #
          are skipped.
        required: false
        default: ""
        type: string
      baseline-file:
        description: >-
          Reviewed baseline file (see the header comment and README). A missing
          file means no finding is baselined; a malformed or expired one fails
          the job.
        required: false
        default: security/image-baselines.yaml
        type: string
      platform:
        description: Image platform to scan (the prod node platform)
        required: false
        default: linux/amd64
        type: string
      artifact-name:
        description: Name of the uploaded report artifact (results.json, per-image JSON and SARIF)
        required: false
        default: trivy-image-scan
        type: string
      ghcr-login:
        description: >-
          Authenticate to ghcr.io (only) with the job's GITHUB_TOKEN so private
          first-party images can be scanned. The caller's job must grant
          `packages: read`, and each private package must give the calling
          repository read access.
        required: false
        default: true
        type: boolean
      helm-version:
        description: Helm version used to render the chart
        required: false
        # renovate: github-releases=helm/helm
        default: v4.3.0
        type: string
      yq-version:
        description: yq release to install (linux amd64 binary)
        required: false
        default: v4.52.5
        type: string
      yq-sha256:
        description: >-
          SHA-256 of yq_linux_amd64 for yq-version, from that release's
          `checksums` file (SHA-256 column, see `checksums_hashes_order`).
          Change it together with yq-version.
        required: false
        default: 75d893a0d5940d1019cb7cdc60001d9e876623852c31cfc6267047bc31149fa9
        type: string
      trivy-version:
        description: Trivy release to install (Linux-64bit tarball)
        required: false
        # renovate: github-release-attachments=aquasecurity/trivy
        default: v0.76.1
        type: string
      trivy-sha256:
        description: >-
          SHA-256 of trivy_<version>_Linux-64bit.tar.gz for trivy-version, from
          that release's trivy_<version>_checksums.txt. Renovate bumps it with
          trivy-version; by hand, change both together.
        required: false
        default: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        type: string

permissions:
  contents: read
  packages: read

jobs:
  image-scan:
    name: trivy image scan
    runs-on: ${{ inputs.runs-on != '' && inputs.runs-on || (github.event.repository.private && 'kupe-small' || 'ubuntu-latest') }}
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ inputs.helm-version }}

      - name: Install yq and trivy
        # Every download is checked against the SHA-256 its upstream release
        # publishes before it is unpacked or run, so a swapped or truncated
        # asset fails the job instead of running. Installs to a user-writable
        # location for self-hosted runners without passwordless sudo.
        shell: bash
        env:
          YQ_VERSION: ${{ inputs.yq-version }}
          YQ_SHA256: ${{ inputs.yq-sha256 }}
          TRIVY_VERSION: ${{ inputs.trivy-version }}
          TRIVY_SHA256: ${{ inputs.trivy-sha256 }}
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          dl="$(mktemp -d -p "$RUNNER_TEMP")"
          mkdir -p "$bin"

          # fetch <tool> <url> <sha256> <file>: download, then verify or fail.
          # <tool> is the prefix of the <tool>-version / <tool>-sha256 inputs,
          # so a mismatch tells the caller which pair to change.
          fetch() {
            local tool="$1" url="$2" want="$3" file="$4" got
            if ! [[ "$want" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::${tool}-sha256 must be a 64-character lowercase hex sha256, got '$want'"
              exit 1
            fi
            curl -fsSLo "$file" "$url"
            got="$(sha256sum < "$file")"
            got="${got%% *}"
            if [ "$got" != "$want" ]; then
              echo "::error::${tool} sha256 mismatch for $url: expected $want, got $got. Set the ${tool}-sha256 input together with ${tool}-version."
              exit 1
            fi
          }

          fetch yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            "$YQ_SHA256" "$dl/yq"
          install -m 0755 "$dl/yq" "$bin/yq"

          fetch trivy "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz" \
            "$TRIVY_SHA256" "$dl/trivy.tar.gz"
          tar -xzf "$dl/trivy.tar.gz" -C "$dl" trivy
          install -m 0755 "$dl/trivy" "$bin/trivy"

          echo "$bin" >> "$GITHUB_PATH"

      - name: Render chart
        # One helm template per values-files line, each to its own file, with
        # stderr left on the log so a render warning or failure is visible.
        shell: bash
        env:
          RELEASE_NAME: ${{ inputs.release-name }}
          CHART_PATH: ${{ inputs.chart-path }}
          TEMPLATE_ARGS: ${{ inputs.template-args }}
          VALUES_FILES: ${{ inputs.values-files }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/trivy-image-scan"
          rm -rf "$out"
          mkdir -p "$out"
          if [ -z "$CHART_PATH" ]; then
            echo "No chart-path; no chart to render."
            exit 0
          fi
          # template-args is shell words, parsed the same way as in the helm
          # audit workflows.
          eval "args=($TEMPLATE_ARGS)"
          n=0

          # render <label> [values file...]: one helm template into $out/<n>.yaml.
          render() {
            local label="$1" f
            shift
            local vargs=()
            for f in "$@"; do
              vargs+=(-f "$f")
            done
            n=$((n + 1))
            printf '%s\n' "$label" > "$out/$n.label"
            echo "Rendering $n: $label"
            helm template "$RELEASE_NAME" "$CHART_PATH" \
              ${args[@]+"${args[@]}"} ${vargs[@]+"${vargs[@]}"} \
              < /dev/null > "$out/$n.yaml"
          }

          while IFS= read -r line || [ -n "$line" ]; do
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%"${line##*[![:space:]]}"}"
            case "$line" in
              '' | '#'*) continue ;;
            esac
            read -r -a files <<< "$line"
            render "$line" "${files[@]}"
          done <<< "$VALUES_FILES"

          if [ "$n" -eq 0 ]; then
            render "chart defaults and template-args"
          fi

      - name: Extract images
        # Every image reference from the chart renders, the manifests and the
        # images input, deduplicated into images.txt; refs.tsv records where
        # each one came from.
        shell: bash
        env:
          MANIFESTS: ${{ inputs.manifests }}
          IMAGES: ${{ inputs.images }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          out="$RUNNER_TEMP/trivy-image-scan"
          mkdir -p "$out"
          tab=$'\t'
          bad=0
          # Every `image:` or `imageName:` string at any depth of every
          # document, as "<Kind>/<name> <path>\t<value>". ConfigMap and Secret
          # data is opaque (a key called image is just a key), so those kinds
          # are skipped. No `|| true`: a yq error must fail the gate, never
          # read as an empty, clean result.
          # shellcheck disable=SC2016
          expr='select(.kind != "ConfigMap" and .kind != "Secret")
            | (.kind // "") as $k | (.metadata.name // "") as $n
            | .. | select(tag == "!!map") | (path | map(tostring) | join(".")) as $p
            | to_entries[] | select((.key == "image" or .key == "imageName") and (.value | tag) == "!!str")
            | $k + "/" + $n + " " + ([$p, .key] | map(select(. != "")) | join(".")) + "\t" + .value'
          # A docker reference: lowercase name components with an optional
          # registry host[:port], then an optional tag and an optional digest.
          # In a manifests file, a value using shell/compose variable
          # interpolation (${VAR}, ${VAR:-x}, $VAR) names an image the scan
          # cannot resolve, so it fails the job. Otherwise a value holding a
          # glob, negation or template character is a policy pattern (a Kyverno
          # "!*:latest"), not an image: listed and skipped. Anything else that
          # is not a valid reference (a truncated digest, say) fails.
          interp_re='[$]([{]|[A-Za-z_])'
          pattern_re='[][*!?{}$<>|[:space:]]'
          ref_re='^[a-z0-9]+([._-]+[a-z0-9]+)*(:[0-9]+)?(/[a-z0-9]+([._-]+[a-z0-9]+)*)*(:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127})?(@sha256:[a-f0-9]{64})?$'

          : > "$out/refs.tsv"
          : > "$out/skipped.tsv"

          # extract <label> <file> <require-image> <no-interpolation>: add
          # every image in <file>. With require-image=1 a file with no image
          # fails the job (a chart render with nothing to scan means a wrong
          # chart path or values). With no-interpolation=1 a value using
          # variable interpolation fails the job instead of being skipped.
          extract() {
            local label="$1" file="$2" require="$3" no_interp="$4" found=0 target image
            # To a file first: a yq error inside <(...) would not stop the job.
            yq -N "$expr" "$file" > "$out/extract.tsv"
            while IFS="$tab" read -r target image; do
              [ -n "$target" ] || continue
              if [ -z "$image" ]; then
                echo "::error::$target is an empty image ($label)"
                bad=1
              elif [[ "$image" =~ $ref_re ]]; then
                printf '%s\t%s\t%s\n' "$image" "$target" "$label" >> "$out/refs.tsv"
                found=1
              elif [ "$no_interp" = 1 ] && [[ "$image" =~ $interp_re ]]; then
                echo "::error::$target is '$image', which uses variable interpolation, so the image cannot be scanned ($label). Write the literal reference."
                bad=1
              elif [[ "$image" =~ $pattern_re ]]; then
                printf '%s\t%s\t%s\n' "$image" "$target" "$label" >> "$out/skipped.tsv"
              else
                echo "::error::$target is '$image', which is neither an image reference nor a pattern ($label)"
                bad=1
              fi
            done < "$out/extract.tsv"
            if [ "$require" = 1 ] && [ "$found" -eq 0 ]; then
              echo "::error::'$label' has no image to scan; check the chart path and values files."
              bad=1
            fi
          }

          sources=0
          i=1
          while [ -f "$out/$i.yaml" ]; do
            extract "render: $(cat "$out/$i.label")" "$out/$i.yaml" 1 0
            sources=$((sources + 1))
            i=$((i + 1))
          done

          while IFS= read -r line || [ -n "$line" ]; do
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%"${line##*[![:space:]]}"}"
            case "$line" in
              '' | '#'*) continue ;;
            esac
            # The line is a glob on purpose: expand it unquoted.
            # shellcheck disable=SC2206
            matches=($line)
            if [ "${#matches[@]}" -eq 0 ]; then
              echo "::error::manifests line '$line' matches no file."
              bad=1
              continue
            fi
            for f in "${matches[@]}"; do
              extract "$f" "$f" 0 1
              sources=$((sources + 1))
            done
          done <<< "$MANIFESTS"

          while IFS= read -r line || [ -n "$line" ]; do
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%"${line##*[![:space:]]}"}"
            case "$line" in
              '' | '#'*) continue ;;
            esac
            if ! [[ "$line" =~ $ref_re ]]; then
              echo "::error::images line '$line' is not an image reference."
              bad=1
              continue
            fi
            printf '%s\t%s\t%s\n' "$line" "images input" "images input" >> "$out/refs.tsv"
            sources=$((sources + 1))
          done <<< "$IMAGES"

          if [ "$sources" -eq 0 ]; then
            echo "::error::Nothing to scan: set chart-path, manifests or images."
            exit 1
          fi

          cut -f1 "$out/refs.tsv" | LC_ALL=C sort -u > "$out/images.txt"
          if [ ! -s "$out/images.txt" ]; then
            echo "::error::No image reference found in any source."
            bad=1
          fi
          echo "Found $(wc -l < "$out/images.txt" | tr -d ' ') unique image(s):"
          while IFS="$tab" read -r image target label; do
            echo "  $image  <- $target ($label)"
          done < <(LC_ALL=C sort -u "$out/refs.tsv")
          if [ -s "$out/skipped.tsv" ]; then
            echo "Skipped (not an image reference):"
            while IFS="$tab" read -r image target label; do
              echo "  '$image'  <- $target ($label)"
            done < <(LC_ALL=C sort -u "$out/skipped.tsv")
          fi
          if [ "$bad" -ne 0 ]; then
            exit 1
          fi

      - name: Load baselines
        # The repository's reviewed baseline file, validated and written as
        # baselines.json for the gate. No file means nothing is baselined.
        # Anything malformed, unknown, duplicated or expired fails the job, so
        # an entry never quietly widens or silently outlives its review.
        shell: bash
        env:
          BASELINE_FILE: ${{ inputs.baseline-file }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/trivy-image-scan"
          mkdir -p "$out"
          if [ -z "$BASELINE_FILE" ] || [ ! -e "$BASELINE_FILE" ]; then
            echo "No baseline file${BASELINE_FILE:+ at $BASELINE_FILE}; no finding is baselined."
            echo '[]' > "$out/baselines.json"
            exit 0
          fi
          # To a file first: a yq parse error must fail the job.
          yq -o=json '.' "$BASELINE_FILE" > "$out/baselines.raw.json"
          # One line per problem; no output means the file is valid.
          # shellcheck disable=SC2016
          check='
            def str: type == "string" and length > 0;
            def date_ok: type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$")
              and ((try (strptime("%Y-%m-%d") | mktime) catch null) != null);
            def days: strptime("%Y-%m-%d") | mktime / 86400;
            ["image", "digest", "platforms", "findings", "reviewedBy", "reviewedOn", "expires", "reason"] as $req
            | ($req + ["signerIdentity", "signerWorkflowSha"]) as $allowed
            | ["id", "installedVersion", "package", "target"] as $fkeys
            | if type != "array" or length == 0 then "the file must be a non-empty YAML list of entries"
              else
                (to_entries[] | .key as $i | .value as $e
                 | ("entry \($i)" + (if ($e | type) == "object" and ($e.image | str) then " (\($e.image))" else "" end)) as $at
                 | if ($e | type) != "object" then "\($at): must be a mapping"
                   else
                     (($req - ($e | keys))[] | "\($at): missing \(.)"),
                     ((($e | keys) - $allowed)[] | "\($at): unknown key \(.)"),
                     (select(($e.image | str | not) or ($e.image | test("@|:[^/]*$")))
                       | "\($at): image must be a repository with no tag or digest"),
                     (select(($e.digest | type) != "string" or ($e.digest | test("^sha256:[a-f0-9]{64}$") | not))
                       | "\($at): digest must be sha256:<64 lowercase hex>"),
                     (select(($e.platforms | type) != "array" or ($e.platforms | length) == 0
                         or ($e.platforms | all(type == "string" and test("^[a-z0-9]+/[a-z0-9]+(/[a-z0-9]+)?$")) | not))
                       | "\($at): platforms must be a non-empty list such as linux/amd64"),
                     (select(($e.findings | type) != "array" or ($e.findings | length) == 0)
                       | "\($at): findings must be a non-empty list"),
                     (if ($e.findings | type) == "array" then
                        ($e.findings | to_entries[] | .key as $j | .value as $f
                         | if ($f | type) != "object" then "\($at) finding \($j): must be a mapping"
                           elif ($f | keys) != $fkeys then "\($at) finding \($j): must have exactly id, package, installedVersion and target"
                           elif ([$f[] | str] | all | not) then "\($at) finding \($j): every field must be a non-empty string"
                           else empty end)
                      else empty end),
                     (["reviewedBy", "reason"][] as $k | select($e[$k] | str | not)
                       | "\($at): \($k) must be a non-empty string"),
                     (["signerIdentity", "signerWorkflowSha"][] as $k | select($e | has($k)) | select($e[$k] | str | not)
                       | "\($at): \($k) must be a non-empty string when set"),
                     (["reviewedOn", "expires"][] as $k | select($e[$k] | date_ok | not)
                       | "\($at): \($k) must be a YYYY-MM-DD date"),
                     (select(($e.reviewedOn | date_ok) and ($e.expires | date_ok))
                       | (select($e.reviewedOn > $today) | "\($at): reviewedOn \($e.reviewedOn) is in the future"),
                         (select($e.expires < $e.reviewedOn) | "\($at): expires before reviewedOn"),
                         (select(($e.expires | days) - ($e.reviewedOn | days) > 90)
                           | "\($at): expires more than 90 days after reviewedOn"),
                         (select($e.expires < $today)
                           | "\($at): expired on \($e.expires); re-review it against a fresh scan"))
                   end),
                ([.[] | select(type == "object") | [.image, .digest]] | group_by(.) | map(select(length > 1))[]
                  | "duplicate entries for \(.[0][0])@\(.[0][1])")
              end'
          today="$(date -u +%Y-%m-%d)"
          jq -r --arg today "$today" "$check" "$out/baselines.raw.json" > "$out/baseline-errors.txt"
          if [ -s "$out/baseline-errors.txt" ]; then
            while IFS= read -r problem; do
              echo "::error file=$BASELINE_FILE::$problem"
            done < "$out/baseline-errors.txt"
            exit 1
          fi
          cp "$out/baselines.raw.json" "$out/baselines.json"
          echo "Loaded $(jq length "$out/baselines.json") baseline entr(ies) from $BASELINE_FILE:"
          jq -r '.[] | "  \(.image)@\(.digest) [\(.platforms | join(", "))]: \(.findings | length) finding(s), reviewed by \(.reviewedBy) on \(.reviewedOn), expires \(.expires)"' \
            "$out/baselines.json"

      - name: Configure ghcr.io credentials
        # A Docker config holding a ghcr.io credential only, in a directory of
        # its own, so the token is never offered to any other registry.
        if: inputs.ghcr-login
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$(mktemp -d -p "$RUNNER_TEMP")"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          umask 077
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$auth" > "$dir/config.json"
          echo "DOCKER_CONFIG=$dir" >> "$GITHUB_ENV"

      - name: Download vulnerability DB
        # A fresh cache directory per job, so the DB is always downloaded and
        # never served stale from a runner cache. A download failure, or a DB
        # older than 24 h (a stale mirror), fails the job.
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v jq > /dev/null; then
            echo "::error::jq is required on the runner (ubuntu-latest and the kupe runner image ship it)."
            exit 1
          fi
          out="$RUNNER_TEMP/trivy-image-scan"
          cache="$RUNNER_TEMP/trivy-cache"
          rm -rf "$cache"
          trivy image --cache-dir "$cache" --download-db-only --no-progress
          trivy version --cache-dir "$cache" --format json > "$out/trivy-version.json"
          updated="$(jq -r '.VulnerabilityDB.UpdatedAt' "$out/trivy-version.json")"
          # UpdatedAt is RFC 3339 with nanoseconds; whole seconds are enough.
          age="$(jq -r '.VulnerabilityDB.UpdatedAt | sub("\\.[0-9]+"; "") | now - fromdateiso8601 | floor' \
            "$out/trivy-version.json")"
          echo "Trivy vulnerability DB updated $updated ($((age / 3600)) h ago)"
          if [ "$age" -gt 86400 ]; then
            echo "::error::Trivy vulnerability DB is $((age / 3600)) h old (updated $updated); refusing to scan with a stale DB."
            exit 1
          fi

      - name: Scan images
        id: scan
        # Per image: ONE Trivy scan reporting every HIGH and CRITICAL finding,
        # fixed or not. The gate status and the findings both come from that
        # one report, so they always describe the same image even when a tag
        # is re-pushed mid-run. A finding is fixable when Trivy's Status is
        # "fixed": exactly what --ignore-unfixed keeps (trivy v0.76.1
        # pkg/flag/vulnerability_flags.go ignores every other status, and
        # pkg/vulnerability/vulnerability.go sets "fixed" whenever FixedVersion
        # is set). The report written to the artifact has the image config
        # (env, history, layer CreatedBy) stripped; SARIF is converted from
        # that stripped report. Every image is scanned before the step ends,
        # so one run lists them all. results.json is the machine-readable
        # outcome (schema in the README).
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/trivy-image-scan"
          cache="$RUNNER_TEMP/trivy-cache"
          reports="$out/reports"
          rm -rf "$reports" "$out/images"
          mkdir -p "$reports/images" "$out/images"
          # shellcheck disable=SC2054 # HIGH,CRITICAL is one comma-separated flag value
          common=(--cache-dir "$cache" --skip-db-update --image-src remote
            --platform "$PLATFORM" --scanners vuln --severity HIGH,CRITICAL
            --no-progress --timeout 15m)

          # Strips what is read from the image config: the config itself
          # (env, entrypoint, labels, history) and every layer's CreatedBy
          # (the history line), wherever Trivy repeats it.
          sanitise='del(.Metadata.ImageConfig, (.. | objects | select(has("CreatedBy")) | .CreatedBy))'

          # One result object per image: every HIGH/CRITICAL finding, fixable
          # when Trivy's Status is "fixed" (see above). Duplicate keys are
          # merged, fixable if any of them is.
          # shellcheck disable=SC2016
          result='
            def rows: [(.Results // [])[] | .Target as $t | (.Vulnerabilities // [])[]
              | {id: .VulnerabilityID, package: .PkgName, installedVersion: .InstalledVersion,
                 fixedVersion: (.FixedVersion // ""), status: (.Status // ""), severity: .Severity, target: $t,
                 fixable: ((.Status // "") == "fixed")}];
            def key: [.id, .package, .installedVersion, .target];
            ($report[0] | rows | group_by(key) | map((map(select(.fixable)) + .)[0])) as $findings
            | {reference: $ref, repository: $repo, digest: (if $digest == "" then null else $digest end),
               platform: $platform,
               status: (if $scan_error then "error"
                        elif ($findings | map(select(.fixable)) | length) > 0 then "fail" else "pass" end),
               counts: {fixable: ($findings | map(select(.fixable)) | length),
                        unfixed: ($findings | map(select(.fixable | not)) | length)},
               findings: $findings}'

          n=0
          while IFS= read -r image; do
            [ -n "$image" ] || continue
            n=$((n + 1))
            slug="$(printf '%s' "$image" | tr -c 'A-Za-z0-9._-' '_')"
            # Repository and digest of the reference as written.
            digest=""
            name="$image"
            if [[ "$image" == *@* ]]; then
              digest="${image##*@}"
              name="${image%@*}"
            fi
            repo="$name"
            last="${name##*/}"
            if [[ "$last" == *:* ]]; then
              repo="${name%:*}"
            fi

            echo "::group::$image"
            raw="$out/images/$slug.trivy.json"
            report="$reports/images/$slug.json"
            scan_error=false
            # Any non-zero exit is an error: no --exit-code is set, so Trivy
            # exits 0 with findings. A report that is not Trivy's schema 2
            # JSON is an error too, never an empty, clean result.
            if ! trivy image "${common[@]}" --format json --output "$raw" "$image"; then
              scan_error=true
            elif ! jq -e '.SchemaVersion == 2 and ((.Results // []) | type) == "array"' "$raw" > /dev/null; then
              echo "::error::Trivy's report for $image is not a schema 2 JSON report."
              scan_error=true
            fi
            if [ "$scan_error" = false ]; then
              jq "$sanitise" "$raw" > "$report"
              trivy convert --format sarif --output "$reports/images/$slug.sarif" "$report"
            else
              echo '{}' > "$report"
            fi
            jq -n --slurpfile report "$report" \
              --arg ref "$image" --arg repo "$repo" --arg digest "$digest" --arg platform "$PLATFORM" \
              --argjson scan_error "$scan_error" "$result" > "$out/images/$slug.result.json"
            rm -f "$raw"

            if [ "$(jq -r '.status' "$out/images/$slug.result.json")" = error ]; then
              echo "::error::Trivy could not scan $image for $PLATFORM; see the log above."
            fi
            echo "::endgroup::"
          done < "$out/images.txt"
          echo "Scanned $n image(s)."

      - name: Apply baselines and gate
        id: gate
        # A fixable finding is baselined only when a reviewed entry names the
        # image's repository, the digest its reference pins, the scanned
        # platform, and the finding's exact ID, package, installed version and
        # target. A CRITICAL is never baselined; a tag-only reference never
        # matches. The job then fails on any image that could not be scanned
        # or still has a fixable HIGH/CRITICAL. Baselined findings stay in
        # results.json and the summary.
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/trivy-image-scan"
          reports="$out/reports"
          mkdir -p "$reports"
          jq -s '.' "$out"/images/*.result.json > "$out/images.results.json"

          # shellcheck disable=SC2016
          apply='
            def key: [.id, .package, .installedVersion, .target];
            $baselines[0] as $b
            | $images[0] | map(
                . as $img
                | [$b[] | select(.image == $img.repository and $img.digest != null and .digest == $img.digest
                    and (.platforms | index($img.platform) != null))] as $entries
                | [$entries[].findings[] | key] as $keys
                | .findings |= map(key as $k | . + {baselined: (.fixable and .severity != "CRITICAL"
                    and ($keys | index([$k]) != null))})
                | (.findings | map(key)) as $seen
                | .counts.baselined = (.findings | map(select(.baselined)) | length)
                | .baseline = (if ($entries | length) == 0 then null else
                    ($entries[0] | {reviewedBy, reviewedOn, expires, reason,
                      notFound: [.findings[] | select(key as $k | $seen | index([$k]) == null)],
                      criticalNotBaselined: [$img.findings[] | select(.severity == "CRITICAL" and .fixable)
                        | select(key as $k | $keys | index([$k]) != null)]}) end)
                | .status = (if .status == "error" then "error"
                    elif (.findings | map(select(.fixable and (.baselined | not))) | length) > 0 then "fail"
                    else "pass" end))'
          jq -n --slurpfile images "$out/images.results.json" \
            --slurpfile baselines "$out/baselines.json" "$apply" > "$out/images.gated.json"

          failed=0
          while IFS= read -r row; do
            ref="$(jq -r '.reference' <<< "$row")"
            if jq -e '.baseline.criticalNotBaselined | length > 0' <<< "$row" > /dev/null; then
              echo "::error::$ref: the baseline lists CRITICAL finding(s), which can never be baselined:"
              jq -r '.baseline.criticalNotBaselined[] | "  \(.id) \(.package) \(.installedVersion)"' <<< "$row"
            fi
            if jq -e '.baseline.notFound | length > 0' <<< "$row" > /dev/null; then
              echo "::warning::$ref: baseline finding(s) no longer reported by the scan; drop them from the entry:"
              jq -r '.baseline.notFound[] | "  \(.id) \(.package) \(.installedVersion) (\(.target))"' <<< "$row"
            fi
            case "$(jq -r '.status' <<< "$row")" in
              error)
                failed=1
                ;;
              fail)
                failed=1
                echo "::error::$ref has $(jq '[.findings[] | select(.fixable and (.baselined | not))] | length' <<< "$row") fixable HIGH/CRITICAL finding(s) not covered by a reviewed baseline; bump it to a fixed release."
                jq -r '.findings[] | select(.fixable and (.baselined | not)) | "  \(.severity) \(.id) \(.package) \(.installedVersion) -> \(.fixedVersion) (\(.target))"' <<< "$row"
                ;;
            esac
          done < <(jq -c '.[]' "$out/images.gated.json")

          status=pass
          [ "$failed" -eq 0 ] || status=fail
          jq -n --slurpfile images "$out/images.gated.json" \
            --slurpfile version "$out/trivy-version.json" \
            --arg platform "$PLATFORM" --arg status "$status" '
            {schemaVersion: 2,
             status: $status,
             platform: $platform,
             policy: {severities: ["HIGH", "CRITICAL"], ignoreUnfixed: true,
                      fails: "any HIGH or CRITICAL finding with a fix available that no reviewed baseline covers (a CRITICAL is never baselined)"},
             trivy: {version: $version[0].Version,
                     vulnerabilityDB: {updatedAt: $version[0].VulnerabilityDB.UpdatedAt}},
             images: ($images[0] | sort_by(.reference))}' > "$reports/results.json"

          # Summary: one row per image, then the failing and baselined findings.
          {
            echo "Scanned $(jq '.images | length' "$reports/results.json") image(s) for \`$PLATFORM\` with Trivy $(jq -r '.trivy.version' "$reports/results.json") (DB $(jq -r '.trivy.vulnerabilityDB.updatedAt' "$reports/results.json")); policy: fail on HIGH/CRITICAL with a fix available, unless a reviewed baseline covers it."
            echo ""
            echo "| Image | Result | Fixable HIGH/CRITICAL | Of which baselined | Unfixed HIGH/CRITICAL (reported only) |"
            echo "| --- | --- | --- | --- | --- |"
            jq -r '.images[] | "| `\(.reference)` | \({pass: "pass", fail: "**FAIL**", error: "**SCAN ERROR**"}[.status]) | \(.counts.fixable) | \(.counts.baselined) | \(.counts.unfixed) |"' \
              "$reports/results.json"
            jq -r '.images[] | select(.status == "fail")
              | "", "**`\(.reference)`** fixable findings not baselined:", "",
                "| Severity | ID | Package | Installed | Fixed in | Target |", "| --- | --- | --- | --- | --- | --- |",
                (.findings[] | select(.fixable and (.baselined | not))
                  | "| \(.severity) | \(.id) | `\(.package)` | \(.installedVersion) | \(.fixedVersion) | `\(.target)` |")' \
              "$reports/results.json"
            jq -r '.images[] | select(.counts.baselined > 0)
              | "", "**`\(.reference)`** baselined findings (reviewed by \(.baseline.reviewedBy) on \(.baseline.reviewedOn), expires \(.baseline.expires)):", "",
                "| Severity | ID | Package | Installed | Fixed in | Target |", "| --- | --- | --- | --- | --- | --- |",
                (.findings[] | select(.baselined)
                  | "| \(.severity) | \(.id) | `\(.package)` | \(.installedVersion) | \(.fixedVersion) | `\(.target)` |")' \
              "$reports/results.json"
          } > "$out/summary.md"
          cat "$out/summary.md"

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "OK: no image has a fixable HIGH or CRITICAL vulnerability outside a reviewed baseline"

      - name: Upload scan reports
        # hashFiles() only sees GITHUB_WORKSPACE, so it cannot test for these
        # files under RUNNER_TEMP; an earlier failure that wrote no report is
        # handled by if-no-files-found instead.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/trivy-image-scan/reports/
          if-no-files-found: ignore
          retention-days: 30

      - name: scan summary
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.gate.outcome }}
        run: |
          set -euo pipefail
          summary="$RUNNER_TEMP/trivy-image-scan/summary.md"
          {
            echo "### Trivy Image Scan"
            case "$OUTCOME" in
              success)
                echo "No scanned image has a fixable HIGH or CRITICAL vulnerability outside a reviewed baseline."
                ;;
              failure)
                echo "**FAILED** — an image has a fixable HIGH or CRITICAL vulnerability no reviewed baseline covers (bump its pin to a fixed release), or could not be scanned."
                ;;
              *)
                # An earlier step failed (tool install, checksum, render,
                # extraction, baseline file, DB download or the scan itself),
                # so the gate never ran.
                echo "**NOT RUN** — an earlier step failed before the scan."
                echo ""
                echo "- Review the job logs for the failing step."
                ;;
            esac
            if [ -f "$summary" ]; then
              echo ""
              cat "$summary"
            fi
            skipped="$RUNNER_TEMP/trivy-image-scan/skipped.tsv"
            if [ -s "$skipped" ]; then
              echo ""
              echo "**Skipped** (patterns or placeholders, not image references):"
              echo ""
              LC_ALL=C sort -u "$skipped" | while IFS=$'\t' read -r image target label; do
                echo "- \`$image\` at \`$target\` ($label)"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
