name: Gates

# One gate job: `pre-commit run`, the same hooks an engineer runs locally, on
# one runner with one checkout and one set of tool installs
# (kupecloud/github-workflows#14). It is the public-repo copy of
# github-workflows' pre-commit-gates.yaml, trimmed to the tools this repo's
# hooks need: github-workflows is private, so a public repo cannot call it.
#
# Always GitHub-hosted: this repo is public and fork PRs run untrusted code,
# so it must never use the kupe-* runners.

on:
  workflow_call:
    inputs:
      pre-commit-args:
        description: >-
          Arguments passed to `pre-commit run`, as shell words. The value is
          eval'd: write it as a literal in the caller and never interpolate
          event data (`github.event.*`, `github.head_ref`, a PR title or
          branch name) into it.
        required: false
        default: "--all-files --show-diff-on-failure"
        type: string
      skip:
        description: >-
          Comma-separated hook ids to skip (pre-commit's SKIP variable). Name
          the reason in the caller.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The go-test hook runs the PostgreSQL integration tests against this
    # service, as the old `Game / postgres` job did.
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_DB: hello_kupe
          POSTGRES_PASSWORD: local-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hello_kupe"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            samples/managed-database/go.sum

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            samples/managed-database/web/package-lock.json

      - name: Install npm dependencies
        run: |
          npm ci --prefix web
          npm ci --prefix samples/managed-database/web

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.18.6

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Install yq
        # Checked against the SHA-256 in the v4.52.5 release's `checksums`
        # file before it is installed.
        env:
          YQ_VERSION: v4.52.5
          YQ_SHA256: 75d893a0d5940d1019cb7cdc60001d9e876623852c31cfc6267047bc31149fa9
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSLo "$RUNNER_TEMP/yq" "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          got="$(sha256sum < "$RUNNER_TEMP/yq")"
          got="${got%% *}"
          if [ "$got" != "$YQ_SHA256" ]; then
            echo "::error::yq sha256 mismatch: expected $YQ_SHA256, got $got"
            exit 1
          fi
          install -m 0755 "$RUNNER_TEMP/yq" "$bin/yq"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Initialize application roles
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -d hello_kupe -v ON_ERROR_STOP=1 < scripts/local-postgres/init.sql

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          # Hook environments are virtualenvs bound to this exact interpreter.
          key: pre-commit-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: python -m pip install "pre-commit==4.2.0"

      - name: Run pre-commit
        id: pre-commit
        env:
          PRE_COMMIT_ARGS: ${{ inputs.pre-commit-args }}
          SKIP: ${{ inputs.skip }}
          PRE_COMMIT_COLOR: always
          MIGRATE_DATABASE_URL: postgres://app_owner:local-owner@127.0.0.1:5432/hello_kupe?sslmode=disable
          TEST_DATABASE_URL: postgres://app_readwrite:local-readwrite@127.0.0.1:5432/hello_kupe?sslmode=disable
        run: |
          set -euo pipefail
          # pre-commit-args is shell words, parsed with eval: callers must pass
          # a literal, never event data.
          eval "args=($PRE_COMMIT_ARGS)"
          if [ -n "$SKIP" ]; then
            echo "::warning::Skipping hooks in CI: $SKIP"
          fi
          pre-commit run "${args[@]}"

      - name: pre-commit summary
        if: always()
        env:
          OUTCOME: ${{ steps.pre-commit.outcome }}
          SKIP: ${{ inputs.skip }}
        run: |
          set -euo pipefail
          {
            echo "### pre-commit gates"
            case "$OUTCOME" in
              success) echo "All hooks passed." ;;
              skipped) echo "pre-commit did not run: an earlier step failed." ;;
              *) echo "pre-commit failed. Review the job log for the failing hook." ;;
            esac
            if [ -n "$SKIP" ]; then
              echo ""
              echo "Skipped in CI: \`$SKIP\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
