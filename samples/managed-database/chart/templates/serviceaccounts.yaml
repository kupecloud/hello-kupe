{{- /*
One ServiceAccount per workload, none with a token: nothing in this sample
calls the Kubernetes API. The migration's ServiceAccount is in
migrate-job.yaml because it must exist before the pre-install hook runs.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: todo-api
  namespace: {{ .Values.api.namespace }}
  labels:
    {{- include "todo.labels" (dict "root" $ "component" "api") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: todo-web
  namespace: {{ .Values.web.namespace }}
  labels:
    {{- include "todo.labels" (dict "root" $ "component" "web") | nindent 4 }}
automountServiceAccountToken: false
