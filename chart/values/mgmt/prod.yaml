# Always-on public game, independent of the captured tenant deployment.
# Practice mode intentionally has no database and requires one replica.
replicaCount: 1
tenant: hello-kupe
cluster: ""
httpRoute:
  hostname: hello.kupe.cloud
nodeSelector:
  kupe.cloud/pool-type: core
tolerations:
  - key: kupe.cloud/pool-type
    operator: Equal
    value: core
    effect: NoSchedule
database:
  enabled: false
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

# Signed image for the public game.
image:
  repository: ghcr.io/kupecloud/hello-kupe
  tag: "1.8.3@sha256:50be8d681deba388ea68d9f8ccfe398bb9b8894e951d6aff079d2d9725e60868"
