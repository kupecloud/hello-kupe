# Always-on public game, independent of the captured tenant deployment.
# Practice mode intentionally has no database and requires one replica.
replicaCount: 1
tenant: hello-kupe
cluster: ""
httpRoute:
  hostname: hello.kupe.cloud
nodeSelector:
  kupe.cloud/pool-type: core
tolerations:
  - key: kupe.cloud/pool-type
    operator: Equal
    value: core
    effect: NoSchedule
database:
  enabled: false
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

# Signed image for the public game.
image:
  repository: ghcr.io/kupecloud/hello-kupe
  tag: "1.9.0@sha256:6db33a42b978b5a7691c301350e6ab3c9b5817027998af35eb5dbb77d56fe53b"

# Release verification reads this namespace's vulnerability reports.
vulnerabilityReportReader:
  enabled: true
  serviceAccount:
    name: kupe-runner-onb-mission-observer
    namespace: kupe-system
