replicaCount: 1

nameOverride: ""
fullnameOverride: ""

tenant: ""
# Cluster name — combined with tenant + domain to build the per-cluster
# hostname `<hostPrefix>.<cluster>.<tenant>.clusters.<domain>` (B3.2 tenant DNS
# zone). Required unless httpRoute.hostname is set explicitly.
cluster: ""
domain: kupe.cloud

image:
  repository: ghcr.io/kupecloud/hello-kupe
  pullPolicy: IfNotPresent
  # Pinned to version AND digest ("X.Y.Z@sha256:..."). Written by the release
  # itself, never by hand: main.yaml builds and signs the image BEFORE
  # semantic-release, and .releaserc.json's prepareCmd stamps tag@digest into
  # this line in the release commit. The template renders repository:tag, so
  # the pod runs exactly the signed digest even if the tag is re-pushed later.
  #
  # The digest is NOT cosmetic. The platform's verify-platform-images policy
  # denies any ghcr.io/kupecloud/* pod without one (a cosign signature is bound
  # to a digest, so a bare tag cannot be verified). Overriding this with a plain
  # tag — `--set image.tag=X.Y.Z` — makes the pod unschedulable on a Kupe
  # cluster, and the only visible symptom is a pod stuck Pending.
  #
  # Empty falls back to Chart.appVersion, which is a bare tag: fine on a dev
  # estate (image verification runs in Audit there), denied on prod.
  tag: "1.4.2@sha256:fac0893ede769951747d1cbc383a576724d6afefeaac20cf8772b04960090f37"

service:
  port: 8080

httpRoute:
  enabled: true
  hostPrefix: hello-kupe
  hostname: ""
  gatewayName: external-gateway
  gatewayNamespace: kube-system

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi

# Horizontal autoscaling. OFF by default, so `replicaCount` governs and the
# quickstart stays a single pod.
#
# When enabled the Deployment stops rendering `replicas` altogether and the
# HPA owns the count — see the note in templates/deployment.yaml for why that
# matters under GitOps.
#
# CPU utilisation is measured against `resources.requests.cpu`, and needs a
# metrics API in the cluster. On Kupe that is already there: each tenant
# vCluster proxies the platform's metrics-server, so `kubectl top` and a
# CPU-based HPA work with nothing extra to install.
#
# The app's other endpoints cost tens of microseconds each, far too little to
# move CPU utilisation. `GET /api/work?ms=N` burns N milliseconds of CPU per
# request (default 50, capped at 1000) so autoscaling can be demonstrated and
# tested with a realistic request rate.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  # Set to a percentage to add a memory target as well. Null means CPU only.
  targetMemoryUtilizationPercentage: null
  # Optional autoscaling/v2 `behavior` block: scale-up/scale-down policies and
  # stabilisation windows. Empty means the Kubernetes defaults.
  behavior: {}

podAnnotations:
  k8s.grafana.com/scrape: "true"
  k8s.grafana.com/metrics.path: "/metrics"
  # metrics.portNumber is rendered from service.port in the deployment
  # template so it can't drift from the container port.
