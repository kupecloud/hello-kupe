{{- if .Values.database.enabled }}
{{- if eq .Values.migrations.namespace .Release.Namespace }}
{{- fail "The migration namespace must differ from the application namespace so the owner binding stays separate." }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "hello-kupe.fullname" . }}-migrate
  namespace: {{ .Values.migrations.namespace }}
  labels:
    {{- include "hello-kupe.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-kupe-migrate
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          env:
            - name: SERVICE_BINDING_ROOT
              value: {{ .Values.database.bindingRoot | quote }}
            - name: DATABASE_BINDING
              value: {{ .Values.database.ownerSecretName | quote }}
          volumeMounts:
            - name: database
              mountPath: {{ printf "%s/%s" .Values.database.bindingRoot .Values.database.ownerSecretName | quote }}
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
      volumes:
        - name: database
          secret:
            secretName: {{ .Values.database.ownerSecretName }}
{{- end }}
