apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hello-kupe.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hello-kupe.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- /*
    With autoscaling enabled the `replicas` field is omitted ENTIRELY rather
    than set to minReplicas. Under GitOps the rendered manifest is the desired
    state: Argo CD with selfHeal would revert every scale event back to this
    number within seconds, fight the HPA, and leave the app pinned at one
    replica with no error anywhere. Omitting the field leaves replica count
    unmanaged by the chart, which is what the HPA needs to own it.
  */}}
  selector:
    matchLabels:
      {{- include "hello-kupe.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hello-kupe.selectorLabels" . | nindent 8 }}
      annotations:
        # Metrics scrape port tracks service.port so the two can't drift.
        # Merge it into podAnnotations (user values win) rather than
        # appending a literal line, so an override of the same key can't
        # produce a duplicate mapping key.
        {{- $annotations := merge (deepCopy .Values.podAnnotations) (dict "k8s.grafana.com/metrics.portNumber" (.Values.service.port | toString)) }}
        {{- toYaml $annotations | nindent 8 }}
    spec:
      # The app never calls the Kubernetes API, so don't mount a SA token.
      automountServiceAccountToken: false
      securityContext:
        # Required by the platform's `platform-require-seccomp` Kyverno
        # policy. Set at the pod level so every container in the pod
        # inherits it; container-level securityContext (below) keeps the
        # container-only fields like capability drop and read-only rootfs.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hello-kupe
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: SERVICE_NAME
              value: {{ include "hello-kupe.fullname" . | quote }}
            - name: TENANT
              value: {{ .Values.tenant | quote }}
            - name: PUBLIC_URL
              value: {{ printf "https://%s" (include "hello-kupe.hostname" .) | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
